<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120f12">
  <title>暗夜童话 AI 对话</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>AI 对话</h1>
  <div id="messages"></div>
  <div class="composer">
    <input type="text" id="userInput" placeholder="输入消息...">
    <button onclick="sendMessage()">发送</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message) return;

      // 显示用户消息
      addMessage('user', message);
      input.value = '';

      // 创建一个 AI 消息容器
      const messagesDiv = document.getElementById('messages');
      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'assistant';
      aiMsgDiv.textContent = 'AI 正在思考';
      aiMsgDiv.classList.add('thinking');
      messagesDiv.appendChild(aiMsgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      let thinkingTimer = null;

      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let pendingText = '';
        let displayedText = '';
        let typing = false;
        let thinkingDots = 0;
        thinkingTimer = setInterval(() => {
          if (displayedText.length > 0) {
            clearInterval(thinkingTimer);
            return;
          }

          thinkingDots = (thinkingDots + 1) % 4;
          aiMsgDiv.textContent = `AI 正在思考${'.'.repeat(thinkingDots)}`;
        }, 300);

        const stopThinking = () => {
          clearInterval(thinkingTimer);
          aiMsgDiv.classList.remove('thinking');
          aiMsgDiv.textContent = '';
        };

        const flushTyping = () => {
          if (!pendingText.length) {
            typing = false;
            return;
          }

          stopThinking();
          const nextChar = pendingText[0];
          pendingText = pendingText.slice(1);
          displayedText += nextChar;
          aiMsgDiv.textContent = displayedText;
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          typing = true;
          setTimeout(flushTyping, nextChar === '\n' ? 0 : 20);
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;

            const data = trimmed.slice(5).trim();
            if (data === '[DONE]') continue;

            try {
              const json = JSON.parse(data);
              if (json.content) {
                pendingText += json.content;
                if (!typing) {
                  flushTyping();
                }
              }
            } catch (e) {
              // 忽略解析错误
            }
          }
        }

        if (!typing && !displayedText.length && pendingText.length) {
          flushTyping();
        }
        if (displayedText.length > 0) {
          clearInterval(thinkingTimer);
        }
      } catch (error) {
        if (thinkingTimer) {
          clearInterval(thinkingTimer);
        }
        aiMsgDiv.classList.remove('thinking');
        aiMsgDiv.textContent = '网络错误：' + error.message;
      }
    }

    function addMessage(role, text) {
      const messagesDiv = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = role;
      msgDiv.textContent = text;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
