<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#120f12">
  <title>暗夜童话 AI 对话</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="conversationSidebar" aria-label="会话导航">
      <div class="brand-lockup">
        <p class="brand-kicker">夜色书页</p>
        <h2 class="brand-title">会话书签</h2>
      </div>

      <button class="new-conversation" id="newConversationButton" type="button">
        新建会话
      </button>

      <section class="history-section" aria-labelledby="historyHeading">
        <div class="history-heading">
          <p class="section-label" id="historyHeading">会话记录</p>
          <span class="conversation-count" id="conversationCount">0</span>
        </div>
        <div class="conversation-list" id="conversationList"></div>
        <p class="empty-conversations" id="emptyConversations" hidden>还没有会话记录。</p>
      </section>

      <button class="account-button" id="accountButton" type="button">
        <span class="account-avatar" aria-hidden="true">未</span>
        <span class="account-copy">
          <strong>未登录</strong>
          <small>登录以同步会话</small>
        </span>
      </button>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <button
          class="sidebar-toggle"
          id="sidebarToggle"
          type="button"
          aria-label="打开会话书签"
          aria-controls="conversationSidebar"
          aria-expanded="false"
          title="打开会话书签"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>

        <div class="chat-heading">
          <p class="chat-kicker">一盏留给夜行者的灯</p>
          <h1>AI 对话</h1>
        </div>

        <div class="chat-header-actions">
          <div class="chat-status" aria-label="当前会话状态">
            <span class="status-dot" aria-hidden="true"></span>
            当前会话
          </div>
          <div class="token-tracker" id="tokenTracker" hidden>
            <button
              class="token-trigger"
              id="tokenTrigger"
              type="button"
              aria-expanded="false"
              aria-controls="tokenPanel"
              title="Token 用量"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="7.5"></circle>
                <path d="M12 7.5v9M9.8 9.3c.7-.7 1.5-1 2.6-1 1.3 0 2.2.6 2.2 1.5 0 1-1 1.5-2.7 1.8-1.5.3-2.3.8-2.3 1.8 0 1 1 1.6 2.5 1.6 1.1 0 2-.3 2.8-1"></path>
              </svg>
              <span class="token-trigger-label">Token</span>
              <strong class="token-trigger-value" id="tokenTriggerValue">0</strong>
            </button>

            <section
              class="token-panel"
              id="tokenPanel"
              aria-label="Token 用量"
              aria-hidden="true"
              aria-live="polite"
            >
              <div class="token-panel-heading">
                <p class="token-panel-kicker">Token 账簿</p>
                <span class="token-panel-state" id="tokenPanelState">已同步</span>
              </div>
              <dl class="token-ledger-list">
                <div class="token-ledger-row">
                  <dt>用户累计</dt>
                  <dd>
                    <strong id="userTokenTotal">0</strong>
                    <span>输入 <b id="userInputTokens">0</b> · 输出 <b id="userOutputTokens">0</b></span>
                  </dd>
                </div>
                <div class="token-ledger-row">
                  <dt>当前会话</dt>
                  <dd>
                    <strong id="conversationTokenTotal">0</strong>
                    <span>输入 <b id="conversationInputTokens">0</b> · 输出 <b id="conversationOutputTokens">0</b></span>
                  </dd>
                </div>
              </dl>
            </section>
          </div>
          <button
            class="account-mobile-button"
            id="mobileAccountButton"
            type="button"
            aria-label="打开用户面板"
            title="用户面板"
          >
            <span class="account-avatar" aria-hidden="true">未</span>
          </button>
        </div>
      </header>

      <div id="messages" aria-live="polite"></div>

      <div class="composer">
        <input type="text" id="userInput" placeholder="输入消息..." autocomplete="off">
        <button class="send-button" id="sendButton" type="button">发送</button>
      </div>
    </main>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <dialog class="delete-dialog" id="deleteDialog" aria-labelledby="deleteDialogTitle" aria-describedby="deleteDialogMessage">
    <div class="delete-dialog-content">
      <p class="dialog-kicker">会话书签</p>
      <h2 class="dialog-title" id="deleteDialogTitle">要撕下这张书签吗？</h2>
      <p class="dialog-message" id="deleteDialogMessage">
        确定要删除“<span id="deleteConversationTitle"></span>”吗？删除后这段本地记录将无法恢复。
      </p>
      <div class="dialog-actions">
        <button class="dialog-cancel" id="cancelDeleteButton" type="button">暂时保留</button>
        <button class="dialog-confirm" id="confirmDeleteButton" type="button">确认删除</button>
      </div>
    </div>
  </dialog>

  <dialog class="account-dialog" id="accountDialog" aria-labelledby="accountDialogTitle">
    <div class="account-dialog-content">
      <p class="dialog-kicker">会话书签</p>
      <h2 class="dialog-title" id="accountDialogTitle">登录你的书页</h2>
      <p class="dialog-message" id="accountDialogMessage">登录后，你的会话可以跟随账户保存。</p>

      <div class="account-mode-switch" role="tablist" aria-label="账户操作">
        <button class="account-mode is-active" id="loginModeButton" type="button" role="tab" aria-selected="true">登录</button>
        <button class="account-mode" id="registerModeButton" type="button" role="tab" aria-selected="false">注册</button>
      </div>

      <form class="account-form" id="accountForm">
        <label for="accountDisplayName" id="accountDisplayNameLabel" hidden>显示名称</label>
        <input id="accountDisplayName" name="displayName" type="text" autocomplete="nickname" maxlength="8" placeholder="1 到 8 个字符" hidden>

        <label for="accountEmail">邮箱</label>
        <input id="accountEmail" name="email" type="email" autocomplete="email" required>

        <label for="accountPassword">密码</label>
        <input id="accountPassword" name="password" type="password" autocomplete="current-password" required>

        <p class="account-feedback" id="accountFeedback" role="status" hidden></p>

        <div class="dialog-actions">
          <button class="dialog-cancel" id="closeAccountButton" type="button">暂时关闭</button>
          <button class="dialog-confirm account-submit" id="accountSubmitButton" type="submit">登录</button>
        </div>
      </form>

      <section class="account-logged-in" id="accountLoggedIn" hidden>
        <p class="account-user-name" id="accountUserName"></p>
        <p class="account-user-email" id="accountUserEmail"></p>
        <div class="dialog-actions">
          <button class="dialog-cancel" id="closeLoggedInButton" type="button">暂时关闭</button>
          <button class="dialog-confirm account-logout" id="logoutButton" type="button">退出登录</button>
        </div>
      </section>
    </div>
  </dialog>

  <script type="module">
    const CONVERSATIONS_KEY = 'fairytale-ai-conversations';
    const ACTIVE_CONVERSATION_KEY = 'fairytale-ai-active-conversation';
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    const newConversationButton = document.getElementById('newConversationButton');
    const conversationList = document.getElementById('conversationList');
    const conversationCount = document.getElementById('conversationCount');
    const emptyConversations = document.getElementById('emptyConversations');
    const deleteDialog = document.getElementById('deleteDialog');
    const deleteConversationTitle = document.getElementById('deleteConversationTitle');
    const cancelDeleteButton = document.getElementById('cancelDeleteButton');
    const confirmDeleteButton = document.getElementById('confirmDeleteButton');
    const accountButton = document.getElementById('accountButton');
    const mobileAccountButton = document.getElementById('mobileAccountButton');
    const sidebar = document.getElementById('conversationSidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarScrim = document.getElementById('sidebarScrim');
    const accountDialog = document.getElementById('accountDialog');
    const accountDialogTitle = document.getElementById('accountDialogTitle');
    const accountDialogMessage = document.getElementById('accountDialogMessage');
    const closeAccountButton = document.getElementById('closeAccountButton');
    const closeLoggedInButton = document.getElementById('closeLoggedInButton');
    const accountForm = document.getElementById('accountForm');
    const accountFeedback = document.getElementById('accountFeedback');
    const accountDisplayName = document.getElementById('accountDisplayName');
    const accountDisplayNameLabel = document.getElementById('accountDisplayNameLabel');
    const accountPassword = document.getElementById('accountPassword');
    const accountSubmitButton = document.getElementById('accountSubmitButton');
    const accountLoggedIn = document.getElementById('accountLoggedIn');
    const accountUserName = document.getElementById('accountUserName');
    const accountUserEmail = document.getElementById('accountUserEmail');
    const logoutButton = document.getElementById('logoutButton');
    const loginModeButton = document.getElementById('loginModeButton');
    const registerModeButton = document.getElementById('registerModeButton');
    const tokenTracker = document.getElementById('tokenTracker');
    const tokenTrigger = document.getElementById('tokenTrigger');
    const tokenPanel = document.getElementById('tokenPanel');
    const tokenPanelState = document.getElementById('tokenPanelState');
    const tokenTriggerValue = document.getElementById('tokenTriggerValue');
    const userTokenTotal = document.getElementById('userTokenTotal');
    const userInputTokens = document.getElementById('userInputTokens');
    const userOutputTokens = document.getElementById('userOutputTokens');
    const conversationTokenTotal = document.getElementById('conversationTokenTotal');
    const conversationInputTokens = document.getElementById('conversationInputTokens');
    const conversationOutputTokens = document.getElementById('conversationOutputTokens');

    let accountMode = 'login';
    let tokenUsage = {
      user: createEmptyTokenSummary(),
      conversations: new Map(),
    };
    const tokenNumberFormatter = new Intl.NumberFormat('zh-CN');
    const compactTokenNumberFormatter = new Intl.NumberFormat('zh-CN', {
      notation: 'compact',
      maximumFractionDigits: 1,
    });
    const numberAnimationFrames = new WeakMap();
    const displayedNumberValues = new WeakMap();


    let currentUser = await getCurrentUser();
    let conversations = currentUser ? await loadConversationsFromServer() : [];
    let activeConversationId = localStorage.getItem(ACTIVE_CONVERSATION_KEY);
    let isSending = false;
    let pendingRefreshTimer = null;
    let thinkingTimer = null;
    let thinkingElement = null;
    let pendingDeleteConversationId = null;
    let deleteDialogReturnFocus = null;

    if (currentUser && (!activeConversationId || !conversations.some((item) => item.id === activeConversationId))) {
      const firstConversation = await createConversation();
      conversations.unshift(firstConversation);
      activeConversationId = firstConversation.id;
      saveState();
    }

    renderConversationList();
    await renderActiveConversation();
    updateAccountButtons();
    await refreshTokenUsage({ animate: false });

    sendButton.addEventListener('click', sendMessage);
    newConversationButton.addEventListener('click', createNewConversation);
    sidebarToggle.addEventListener('click', toggleSidebar);
    sidebarScrim.addEventListener('click', closeSidebar);
    cancelDeleteButton.addEventListener('click', closeDeleteDialog);
    confirmDeleteButton.addEventListener('click', confirmDeleteConversation);
    accountButton.addEventListener('click', openAccountDialog);
    mobileAccountButton.addEventListener('click', openAccountDialog);
    closeAccountButton.addEventListener('click', closeAccountDialog);
    closeLoggedInButton.addEventListener('click', closeAccountDialog);
    accountForm.addEventListener('submit', handleAccountSubmit);
    logoutButton.addEventListener('click', handleLogout);
    tokenTrigger.addEventListener('click', toggleTokenPanel);
    document.addEventListener('click', handleDocumentClick);
    loginModeButton.addEventListener('click', () => setAccountMode('login'));
    registerModeButton.addEventListener('click', () => setAccountMode('register'));
    deleteDialog.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeDeleteDialog();
    });
    deleteDialog.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeDeleteDialog();
      }
    });
    deleteDialog.addEventListener('click', (event) => {
      if (event.target === deleteDialog) {
        closeDeleteDialog();
      }
    });
    accountDialog.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeAccountDialog();
    });
    accountDialog.addEventListener('click', (event) => {
      if (event.target === accountDialog) {
        closeAccountDialog();
      }
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeTokenPanel();
        closeSidebar();
      }
    });

    function openSidebar() {
      closeTokenPanel();
      sidebar.classList.add('is-open');
      sidebarScrim.classList.add('is-visible');
      document.body.classList.add('sidebar-open');
      sidebarToggle.setAttribute('aria-expanded', 'true');
      sidebarToggle.setAttribute('aria-label', '关闭会话书签');
      sidebarToggle.setAttribute('title', '关闭会话书签');
    }

    function closeSidebar() {
      sidebar.classList.remove('is-open');
      sidebarScrim.classList.remove('is-visible');
      document.body.classList.remove('sidebar-open');
      sidebarToggle.setAttribute('aria-expanded', 'false');
      sidebarToggle.setAttribute('aria-label', '打开会话书签');
      sidebarToggle.setAttribute('title', '打开会话书签');
    }

    function toggleSidebar() {
      if (sidebar.classList.contains('is-open')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    }

    function toggleTokenPanel() {
      setTokenPanelOpen(!tokenTracker.classList.contains('is-open'));
    }

    function setTokenPanelOpen(open) {
      tokenTracker.classList.toggle('is-open', open);
      tokenTrigger.setAttribute('aria-expanded', String(open));
      tokenPanel.setAttribute('aria-hidden', String(!open));
    }

    function closeTokenPanel() {
      setTokenPanelOpen(false);
    }

    function handleDocumentClick(event) {
      if (
        tokenTracker.classList.contains('is-open') &&
        event.target instanceof Node &&
        !tokenTracker.contains(event.target)
      ) {
        closeTokenPanel();
      }
    }

    function createId() {
      if (window.crypto && window.crypto.randomUUID) {
        return window.crypto.randomUUID();
      }

      return crypto.randomUUID();
    }

    function openAccountDialog() {
      // 调用者：侧栏账户按钮或移动端账户按钮；根据 currentUser 决定显示登录/注册表单或已登录面板。
      closeTokenPanel();
      accountFeedback.hidden = true;
      accountFeedback.textContent = '';
      if (currentUser) {
        showLoggedInAccount();
      } else {
        showAccountForm();
      }
      accountDialog.showModal();
    }

    function closeAccountDialog() {
      if (accountDialog.open) {
        accountDialog.close();
      }
    }

    async function handleAccountSubmit(event) {
      // 调用链：登录/注册表单 submit → 对应 AuthController 接口 → 后端写入 HttpOnly Session Cookie（登录时） →
      // 重新读取当前用户会话列表 → 选中首个会话 → 刷新侧栏和消息区。
      event.preventDefault();
      const formData = new FormData(accountForm);
      const email = formData.get('email');
      const password = formData.get('password');
      const displayName = formData.get('displayName');

      try {
        const endpoint = accountMode === 'register' ? '/api/auth/register' : '/api/auth/login';
        const body = accountMode === 'register'
          ? { email, password, displayName }
          : { email, password };
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || '登录失败');
        }

        if (accountMode === 'register') {
          accountFeedback.textContent = '注册成功，请使用新账户登录。';
          accountFeedback.hidden = false;
          accountForm.reset();
          setAccountMode('login');
          return;
        }

        currentUser = data;
        conversations = await loadConversationsFromServer();
        activeConversationId = null;
        if (!conversations.length) {
          const firstConversation = await createConversation();
          conversations.unshift(firstConversation);
          activeConversationId = firstConversation.id;
        } else {
          activeConversationId = conversations[0].id;
        }
        saveState();
        renderConversationList();
        await renderActiveConversation();
        updateAccountButtons();
        await refreshTokenUsage({ animate: false });
        closeAccountDialog();
      } catch (error) {
        accountFeedback.textContent = error instanceof Error ? error.message : '操作失败';
        accountFeedback.hidden = false;
      }
    }

    async function handleLogout() {
      // 调用链：退出按钮 → POST /api/auth/logout → 后端删除 Session 和 Cookie →
      // 清空 currentUser、停止消息轮询、清空当前页面会话并回到未登录状态。
      logoutButton.disabled = true;
      try {
        const response = await fetch('/api/auth/logout', { method: 'POST' });
        if (!response.ok) throw new Error('退出登录失败');
        currentUser = null;
        conversations = [];
        activeConversationId = null;
        tokenUsage = {
          user: createEmptyTokenSummary(),
          conversations: new Map(),
        };
        stopPendingRefresh();
        messagesDiv.replaceChildren();
        saveState();
        renderConversationList();
        closeTokenPanel();
        renderTokenUsage({ animate: false });
        updateAccountButtons();
        closeAccountDialog();
      } catch (error) {
        accountFeedback.textContent = error instanceof Error ? error.message : '退出登录失败';
        accountFeedback.hidden = false;
      } finally {
        logoutButton.disabled = false;
      }
    }

    function setAccountMode(mode) {
      // 调用者：登录/注册切换按钮；只改变表单字段和提交接口，不触碰当前 Session。
      accountMode = mode;
      const isRegister = mode === 'register';
      loginModeButton.classList.toggle('is-active', !isRegister);
      registerModeButton.classList.toggle('is-active', isRegister);
      loginModeButton.setAttribute('aria-selected', String(!isRegister));
      registerModeButton.setAttribute('aria-selected', String(isRegister));
      accountDialogTitle.textContent = isRegister ? '留下你的名字' : '登录你的书页';
      accountDialogMessage.textContent = isRegister ? '注册后，你的会话会与账户一起保存。' : '登录后，你的会话可以跟随账户保存。';
      accountDisplayName.hidden = !isRegister;
      accountDisplayNameLabel.hidden = !isRegister;
      accountDisplayName.required = isRegister;
      accountPassword.autocomplete = isRegister ? 'new-password' : 'current-password';
      accountSubmitButton.textContent = isRegister ? '注册' : '登录';
    }

    function showAccountForm() {
      accountForm.hidden = false;
      accountLoggedIn.hidden = true;
      document.querySelector('.account-mode-switch').hidden = false;
      setAccountMode(accountMode);
    }

    function showLoggedInAccount() {
      accountForm.hidden = true;
      accountLoggedIn.hidden = false;
      document.querySelector('.account-mode-switch').hidden = true;
      accountDialogTitle.textContent = '你的书页';
      accountDialogMessage.textContent = '当前登录状态会保存你的会话记录。';
      accountUserName.textContent = currentUser?.displayName || '';
      accountUserEmail.textContent = currentUser?.email || '';
    }

    async function getCurrentUser() {
      // 调用链：页面初始化 → GET /api/auth/me → SessionAuthGuard → 返回当前用户；
      // 未登录或请求失败返回 null，初始化阶段不创建会话。
      try {
        const response = await fetch('/api/auth/me');
        return response.ok ? await response.json() : null;
      } catch {
        return null;
      }
    }

    function updateAccountButtons() {
      const name = currentUser?.displayName || '未登录';
      tokenTracker.hidden = !currentUser;
      if (!currentUser) {
        closeTokenPanel();
      }
      for (const button of [accountButton, mobileAccountButton]) {
        const avatar = button.querySelector('.account-avatar');
        if (avatar) avatar.textContent = name.slice(0, 1);
      }
      const label = accountButton.querySelector('strong');
      const hint = accountButton.querySelector('small');
      if (label) label.textContent = name;
      if (hint) hint.textContent = currentUser ? '已登录' : '登录以同步会话';
    }

    async function createConversation() {
  // 调用者：页面首次初始化或“新建会话”按钮；调用 POST /api/conversations，
  // 后端从 Session 取得 userId 后创建归属该用户的 Conversation。
  if (!currentUser) throw new Error('请先登录');
  const response = await fetch('/api/conversations', {
    method: 'POST',
  });

  if (!response.ok) {
    throw new Error('创建会话失败');
  }

  const data = await response.json();

  return {
    id: data.conversationId,
    title: '新会话',
    updatedAt: Date.now(),
    messages: [],
  };
}

async function loadConversationsFromServer() {
  // 调用者：页面初始化或登录成功；调用 GET /api/conversations，
  // 后端按 Session 用户过滤，返回值转换为前端 conversations 状态。
  if (!currentUser) return [];
  try {
    const response = await fetch('/api/conversations');

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error('会话列表格式错误');
    }

    return data.map((item) => ({
      id: item.id,
      title: typeof item.title === 'string' ? item.title : '新会话',
      updatedAt: Date.parse(item.updatedAt) || Date.now(),
      messages: [],
    }));
  } catch (error) {
    console.error('读取数据库会话失败：', error);

    // 后端暂时不可用时，保留本地数据作为临时备用
    return loadConversations();
  }
}

async function loadConversationMessages(conversationId) {
  // 调用者：renderActiveConversation；调用 GET /api/conversations/:id/messages，
  // 后端检查会话归属后返回消息，随后由 renderMessages 生成 DOM。
  const response = await fetch(
    `/api/conversations/${encodeURIComponent(conversationId)}/messages`,
  );

  if (!response.ok) {
    throw new Error(`读取聊天记录失败：HTTP ${response.status}`);
  }

  const data = await response.json();

  if (!Array.isArray(data)) {
    throw new Error('聊天记录格式错误');
  }

    return data
      .filter(
        (message) =>
          message &&
        (message.role === 'user' ||
           message.role === 'assistant' ||
           message.role === 'system') &&
         typeof message.content === 'string' &&
         (message.status === 'PENDING' ||
           message.status === 'COMPLETED' ||
           message.status === 'FAILED'),
      )
      .map((message) => ({
        role: message.role,
        text: message.content,
        status: message.status,
      }));
  }

    function loadConversations() {
      try {
        const saved = localStorage.getItem(CONVERSATIONS_KEY);
        const parsed = saved ? JSON.parse(saved) : [];

        if (!Array.isArray(parsed)) return [];

        return parsed
          .filter((item) => item && typeof item.id === 'string')
          .map((item) => ({
            id: item.id,
            title: typeof item.title === 'string' ? item.title : '新会话',
            updatedAt: Number(item.updatedAt) || Date.now(),
            messages: Array.isArray(item.messages)
              ? item.messages.filter(
                  (message) =>
                    message &&
                    (message.role === 'user' ||
                      message.role === 'assistant' ||
                      message.role === 'system') &&
                    typeof message.text === 'string',
                )
              : [],
          }));
      } catch (error) {
        return [];
      }
    }

    function saveState() {
      try {
        localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(conversations));
        localStorage.setItem(ACTIVE_CONVERSATION_KEY, activeConversationId);
      } catch (error) {
        // 本地存储不可用时，当前页面仍可继续聊天
      }
    }

    function getConversation(conversationId = activeConversationId) {
      return conversations.find((conversation) => conversation.id === conversationId);
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();

      if (
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate()
      ) {
        return date.toLocaleTimeString('zh-CN', {
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      return `${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
    }

    function createEmptyTokenSummary() {
      return {
        inputTokens: 0,
        outputTokens: 0,
        totalTokens: 0,
        callCount: 0,
        unknownInputCallCount: 0,
        unknownOutputCallCount: 0,
      };
    }

    function normalizeTokenSummary(summary) {
      return {
        inputTokens: Number(summary?.inputTokens) || 0,
        outputTokens: Number(summary?.outputTokens) || 0,
        totalTokens: Number(summary?.totalTokens) || 0,
        callCount: Number(summary?.callCount) || 0,
        unknownInputCallCount: Number(summary?.unknownInputCallCount) || 0,
        unknownOutputCallCount: Number(summary?.unknownOutputCallCount) || 0,
      };
    }

    function getConversationUsage(conversationId = activeConversationId) {
      return (
        tokenUsage.conversations.get(conversationId) ??
        createEmptyTokenSummary()
      );
    }

    function formatCompactToken(value) {
      const number = Number(value) || 0;
      return number < 1000
        ? tokenNumberFormatter.format(number)
        : compactTokenNumberFormatter.format(number);
    }

    function renderTokenUsage({ animate = false } = {}) {
      const userSummary = normalizeTokenSummary(tokenUsage.user);
      const conversationSummary = getConversationUsage();

      animateTokenNumber(tokenTriggerValue, userSummary.totalTokens, animate);
      animateTokenNumber(userTokenTotal, userSummary.totalTokens, animate);
      animateTokenNumber(userInputTokens, userSummary.inputTokens, animate);
      animateTokenNumber(userOutputTokens, userSummary.outputTokens, animate);
      animateTokenNumber(
        conversationTokenTotal,
        conversationSummary.totalTokens,
        animate,
      );
      animateTokenNumber(
        conversationInputTokens,
        conversationSummary.inputTokens,
        animate,
      );
      animateTokenNumber(
        conversationOutputTokens,
        conversationSummary.outputTokens,
        animate,
      );
    }

    function animateTokenNumber(element, value, animate) {
      const target = Math.max(0, Math.round(Number(value) || 0));
      const from = displayedNumberValues.get(element) ?? 0;
      const existingFrame = numberAnimationFrames.get(element);

      if (existingFrame) {
        cancelAnimationFrame(existingFrame);
      }

      const setValue = (nextValue) => {
        displayedNumberValues.set(element, nextValue);
        element.textContent = tokenNumberFormatter.format(nextValue);
      };
      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)',
      ).matches;

      if (!animate || reduceMotion || from === target) {
        numberAnimationFrames.delete(element);
        setValue(target);
        return;
      }

      const duration = 720;
      const startTime = performance.now();
      const frame = (now) => {
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(from + (target - from) * eased);
        setValue(current);

        if (progress < 1) {
          numberAnimationFrames.set(element, requestAnimationFrame(frame));
        } else {
          numberAnimationFrames.delete(element);
          setValue(target);
        }
      };

      numberAnimationFrames.set(element, requestAnimationFrame(frame));
    }

    async function refreshTokenUsage({ animate = false } = {}) {
      if (!currentUser) {
        tokenUsage = {
          user: createEmptyTokenSummary(),
          conversations: new Map(),
        };
        renderTokenUsage({ animate: false });
        return;
      }

      tokenPanelState.textContent = '同步中';

      try {
        const response = await fetch('/api/usage');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        tokenUsage = {
          user: normalizeTokenSummary(data.user),
          conversations: new Map(
            Array.isArray(data.conversations)
              ? data.conversations.map((summary) => [
                  summary.conversationId,
                  normalizeTokenSummary(summary),
                ])
              : [],
          ),
        };

        tokenPanelState.textContent = '已同步';
        renderConversationList();
        renderTokenUsage({ animate });
      } catch (error) {
        tokenPanelState.textContent = '暂未同步';
        console.error('刷新 Token 用量失败：', error);
      }
    }

    function renderConversationList() {
      conversationList.replaceChildren();
      conversationCount.textContent = String(conversations.length);
      emptyConversations.hidden = conversations.length > 0;

      conversations
        .slice()
        .sort((a, b) => b.updatedAt - a.updatedAt)
        .forEach((conversation) => {
          const item = document.createElement('div');
          item.className = 'conversation-item';

          const selectButton = document.createElement('button');
          selectButton.type = 'button';
          selectButton.className = 'conversation-select';
          selectButton.classList.toggle('is-active', conversation.id === activeConversationId);
          selectButton.disabled = isSending;
          selectButton.setAttribute('aria-pressed', String(conversation.id === activeConversationId));
          selectButton.innerHTML = `
            <span class="conversation-copy">
              <span class="conversation-title"></span>
              <span class="conversation-meta">
                <span class="conversation-time"></span>
                <span class="conversation-token"></span>
              </span>
            </span>
          `;
          selectButton.querySelector('.conversation-title').textContent = conversation.title;
          selectButton.querySelector('.conversation-time').textContent = formatTime(conversation.updatedAt);
          const tokenElement = selectButton.querySelector('.conversation-token');
          const conversationTokens = getConversationUsage(conversation.id).totalTokens;
          tokenElement.textContent = `${formatCompactToken(conversationTokens)} token`;
          tokenElement.setAttribute(
            'aria-label',
            `Token 用量 ${tokenNumberFormatter.format(conversationTokens)}`,
          );
          selectButton.addEventListener('click', () => selectConversation(conversation.id));

          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'conversation-delete';
          deleteButton.textContent = '删除';
          deleteButton.title = '删除会话';
          deleteButton.setAttribute('aria-label', `删除会话：${conversation.title}`);
          deleteButton.disabled = isSending;
          deleteButton.addEventListener('click', () => deleteConversation(conversation.id));

          item.append(selectButton, deleteButton);
          conversationList.appendChild(item);
        });
    }

function hasPendingMessage(conversation) {
  return conversation?.messages.some(
    (message) =>
      message.role === 'assistant' && message.status === 'PENDING',
  ) ?? false;
}

function renderMessages(conversation) {
  stopThinkingAnimation();
  messagesDiv.replaceChildren();

  conversation.messages.forEach((message) => {
    const messageClass =
      message.role === 'system' ? 'system-message' : message.role;

    if (message.status === 'PENDING') {
      const messageElement = addMessage(messageClass, '', false);
      startThinkingAnimation(messageElement);
      return;
    }

    const messageText =
      message.status === 'FAILED'
        ? 'AI 回复失败，请重新发送。'
        : message.text;

    addMessage(messageClass, messageText, false);
  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function stopThinkingAnimation() {
  if (thinkingTimer) {
    clearInterval(thinkingTimer);
    thinkingTimer = null;
  }

  if (thinkingElement) {
    thinkingElement.classList.remove('thinking');
    thinkingElement = null;
  }
}

function startThinkingAnimation(element) {
  stopThinkingAnimation();
  thinkingElement = element;
  thinkingElement.classList.add('thinking');

  let thinkingDots = 0;
  thinkingElement.textContent = 'AI 正在思考';
  thinkingTimer = setInterval(() => {
    thinkingDots = (thinkingDots + 1) % 4;
    thinkingElement.textContent =
      `AI 正在思考${'.'.repeat(thinkingDots)}`;
  }, 300);
}

function stopPendingRefresh() {
  if (pendingRefreshTimer) {
    clearInterval(pendingRefreshTimer);
    pendingRefreshTimer = null;
  }
}

function startPendingRefresh(conversationId) {
  stopPendingRefresh();

  pendingRefreshTimer = setInterval(async () => {
    if (conversationId !== activeConversationId) {
      stopPendingRefresh();
      return;
    }

    const conversation = getConversation(conversationId);
    if (!conversation) {
      stopPendingRefresh();
      return;
    }

    try {
      const previousMessages = conversation.messages;
      conversation.messages = await loadConversationMessages(
        conversationId,
      );
      const wasPending = hasPendingMessage({ messages: previousMessages });
      const isPending = hasPendingMessage(conversation);

      if (wasPending !== isPending || !wasPending) {
        renderMessages(conversation);
      }

      if (isPending) {
        setSendingState(true);
      } else {
        stopPendingRefresh();
        setSendingState(false);
      }
    } catch (error) {
      console.error('刷新聊天记录失败：', error);
    }
  }, 1000);
}

async function renderActiveConversation() {
  // 调用者：初始化、切换会话、新建会话和登录成功；先加载消息，再根据 PENDING 状态决定是否轮询。
  const conversation = getConversation();
  stopPendingRefresh();

  if (!currentUser || !conversation) {
    messagesDiv.replaceChildren();
    setSendingState(false);
    return;
  }

  try {
    conversation.messages = await loadConversationMessages(
      conversation.id,
    );
  } catch (error) {
    console.error('加载聊天记录失败：', error);
    return;
  }

  renderMessages(conversation);

  if (hasPendingMessage(conversation)) {
    setSendingState(true);
    startPendingRefresh(conversation.id);
  } else {
    setSendingState(false);
  }
}

    function selectConversation(conversationId) {
      if (isSending || conversationId === activeConversationId) return;

      activeConversationId = conversationId;
      closeSidebar();
      saveState();
      renderConversationList();
      renderTokenUsage({ animate: false });
      renderActiveConversation();
      input.focus();
    }

    async function createNewConversation() {
      // 调用者：新建会话按钮；未登录时打开登录框，已登录时调用 createConversation 并切换当前会话。
      if (!currentUser) {
        openAccountDialog();
        return;
      }
      if (isSending) return;

      closeSidebar();
      const conversation = await createConversation();
      conversations.unshift(conversation);
      activeConversationId = conversation.id;
      tokenUsage.conversations.set(
        conversation.id,
        createEmptyTokenSummary(),
      );
      saveState();
      renderConversationList();
      renderTokenUsage({ animate: false });
      renderActiveConversation();
      input.focus();
    }

    function deleteConversation(conversationId) {
      if (isSending) return;

      const conversation = getConversation(conversationId);
      if (!conversation) return;

      pendingDeleteConversationId = conversationId;
      deleteDialogReturnFocus = document.activeElement;
      deleteConversationTitle.textContent = conversation.title;
      deleteDialog.showModal();
    }

    function closeDeleteDialog() {
      if (!deleteDialog.open || deleteDialog.classList.contains('is-closing')) return;

      deleteDialog.classList.add('is-closing');
      window.setTimeout(() => {
        deleteDialog.classList.remove('is-closing');
        deleteDialog.close();
        pendingDeleteConversationId = null;
        if (deleteDialogReturnFocus instanceof HTMLElement) {
          deleteDialogReturnFocus.focus();
        }
        deleteDialogReturnFocus = null;
      }, 160);
    }

    function confirmDeleteConversation() {
      const conversationId = pendingDeleteConversationId;
      if (!conversationId) return;

      closeDeleteDialog();
      window.setTimeout(() => performDeleteConversation(conversationId), 160);
    }

    async function performDeleteConversation(conversationId) {
      const conversation = getConversation(conversationId);
      if (!conversation) return;

      try {
        const response = await fetch(
          `/api/chat/${encodeURIComponent(conversationId)}`,
          {
            method: 'DELETE',
          },
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.deleted) {
          throw new Error('会话不存在或已经删除');
        }
      } catch (error) {
        console.error('删除会话失败：', error);
        return;
      }

      conversations = conversations.filter((item) => item.id !== conversationId);
      tokenUsage.conversations.delete(conversationId);

      if (conversations.length === 0) {
        const replacement = await createConversation();
        conversations.push(replacement);
        activeConversationId = replacement.id;
        tokenUsage.conversations.set(
          replacement.id,
          createEmptyTokenSummary(),
        );
      } else if (conversationId === activeConversationId) {
        activeConversationId = conversations[0].id;
      }

      saveState();
      renderConversationList();
      renderTokenUsage({ animate: false });
      renderActiveConversation();
      input.focus();
    }

    function recordUserMessage(conversationId, text) {
      const conversation = getConversation(conversationId);
      if (!conversation) return;

      conversation.messages.push({ role: 'user', text });
      if (conversation.title === '新会话') {
        conversation.title = text.length > 28 ? `${text.slice(0, 28)}...` : text;
      }
      conversation.updatedAt = Date.now();
      saveState();
      renderConversationList();
    }

    function recordAssistantMessage(conversationId, text) {
      const conversation = getConversation(conversationId);
      if (!conversation || !text) return;

      conversation.messages.push({
        role: 'assistant',
        text,
        status: 'COMPLETED',
      });
      conversation.updatedAt = Date.now();
      saveState();
      renderConversationList();
    }

    function recordSystemMessage(conversationId, text) {
      const conversation = getConversation(conversationId);
      if (!conversation || !text) return;

      conversation.messages.push({ role: 'system', text });
      saveState();
    }

    function setSendingState(sending) {
      isSending = sending;
      input.disabled = sending;
      sendButton.disabled = sending;
      newConversationButton.disabled = sending;
      renderConversationList();
    }

    async function sendMessage() {
      // 调用者：发送按钮或输入框 Enter；未登录时打开登录框，已登录时调用流式聊天接口，
      // 接收 SSE 片段并把完整回答记录到前端状态。
      const message = input.value.trim();
      if (!currentUser) {
        openAccountDialog();
        return;
      }
      if (!message || isSending) return;

      const conversationId = activeConversationId;
      setSendingState(true);

      // 显示用户消息
      addMessage('user', message);
      recordUserMessage(conversationId, message);
      input.value = '';

      // 创建一个 AI 消息容器
      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'assistant';
      messagesDiv.appendChild(aiMsgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      startThinkingAnimation(aiMsgDiv);

      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversationId,
            message,
          }),
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let pendingText = '';
        let displayedText = '';
        let receivedText = '';
        let roundCompleted = false;
        const receivedSystemMessages = [];
        let typing = false;
        const stopThinking = () => {
          stopThinkingAnimation();
          aiMsgDiv.textContent = '';
        };

        const flushTyping = () => {
          if (!pendingText.length) {
            typing = false;
            return;
          }

          stopThinking();
          const nextChar = pendingText[0];
          pendingText = pendingText.slice(1);
          displayedText += nextChar;
          aiMsgDiv.textContent = displayedText;
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          typing = true;
          setTimeout(flushTyping, nextChar === '\n' ? 0 : 20);
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;

            const data = trimmed.slice(5).trim();
            if (data === '[DONE]') continue;

            try {
              const json = JSON.parse(data);
              if (json.type === 'system' && json.message) {
                addMessage('system-message', json.message);
                receivedSystemMessages.push(json.message);
                continue;
              }

              if (json.content) {
                pendingText += json.content;
                receivedText += json.content;
                if (!typing) {
                  flushTyping();
                }
              }
            } catch (e) {
              // 忽略解析错误
            }
          }
        }

        if (!typing && !displayedText.length && pendingText.length) {
          flushTyping();
        }
        if (displayedText.length > 0) {
          stopThinkingAnimation();
        }
        recordAssistantMessage(conversationId, receivedText);
        receivedSystemMessages.forEach((systemMessage) => {
          recordSystemMessage(conversationId, systemMessage);
        });
        roundCompleted = true;
      } catch (error) {
        stopThinkingAnimation();
        aiMsgDiv.classList.remove('thinking');
        aiMsgDiv.textContent = '网络错误：' + error.message;
      } finally {
        setSendingState(false);
        input.focus();
        if (roundCompleted) {
          void refreshTokenUsage({ animate: true });
        }
      }
    }

    function addMessage(role, text, shouldScroll = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = role;
      msgDiv.textContent = text;
      messagesDiv.appendChild(msgDiv);
      if (shouldScroll) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
      return msgDiv;
    }
  </script>
</body>
