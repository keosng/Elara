<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#120f12">
  <title>暗夜童话 AI 对话</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="conversationSidebar" aria-label="会话导航">
      <div class="brand-lockup">
        <p class="brand-kicker">夜色书页</p>
        <h2 class="brand-title">会话书签</h2>
      </div>

      <button class="new-conversation" id="newConversationButton" type="button">
        新建会话
      </button>

      <section class="history-section" aria-labelledby="historyHeading">
        <div class="history-heading">
          <p class="section-label" id="historyHeading">会话记录</p>
          <span class="conversation-count" id="conversationCount">0</span>
        </div>
        <div class="conversation-list" id="conversationList"></div>
        <p class="empty-conversations" id="emptyConversations" hidden>还没有会话记录。</p>
      </section>

      <button class="account-button" id="accountButton" type="button">
        <span class="account-avatar" aria-hidden="true">未</span>
        <span class="account-copy">
          <strong>未登录</strong>
          <small>登录以同步会话</small>
        </span>
      </button>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <button
          class="sidebar-toggle"
          id="sidebarToggle"
          type="button"
          aria-label="打开会话书签"
          aria-controls="conversationSidebar"
          aria-expanded="false"
          title="打开会话书签"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>

        <div class="chat-heading">
          <p class="chat-kicker">一盏留给夜行者的灯</p>
          <h1>AI 对话</h1>
        </div>

        <div class="chat-header-actions">
          <div class="chat-status" aria-label="当前会话状态">
            <span class="status-dot" aria-hidden="true"></span>
            当前会话
          </div>
          <button
            class="account-mobile-button"
            id="mobileAccountButton"
            type="button"
            aria-label="打开用户面板"
            title="用户面板"
          >
            <span class="account-avatar" aria-hidden="true">未</span>
          </button>
        </div>
      </header>

      <div id="messages" aria-live="polite"></div>

      <div class="composer">
        <input type="text" id="userInput" placeholder="输入消息..." autocomplete="off">
        <button class="send-button" id="sendButton" type="button">发送</button>
      </div>
    </main>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <dialog class="delete-dialog" id="deleteDialog" aria-labelledby="deleteDialogTitle" aria-describedby="deleteDialogMessage">
    <div class="delete-dialog-content">
      <p class="dialog-kicker">会话书签</p>
      <h2 class="dialog-title" id="deleteDialogTitle">要撕下这张书签吗？</h2>
      <p class="dialog-message" id="deleteDialogMessage">
        确定要删除“<span id="deleteConversationTitle"></span>”吗？删除后这段本地记录将无法恢复。
      </p>
      <div class="dialog-actions">
        <button class="dialog-cancel" id="cancelDeleteButton" type="button">暂时保留</button>
        <button class="dialog-confirm" id="confirmDeleteButton" type="button">确认删除</button>
      </div>
    </div>
  </dialog>

  <dialog class="account-dialog" id="accountDialog" aria-labelledby="accountDialogTitle">
    <div class="account-dialog-content">
      <p class="dialog-kicker">会话书签</p>
      <h2 class="dialog-title" id="accountDialogTitle">登录你的书页</h2>
      <p class="dialog-message">登录后，你的会话可以跟随账户保存。</p>

      <form class="account-form" id="accountForm">
        <label for="accountEmail">邮箱</label>
        <input id="accountEmail" name="email" type="email" autocomplete="email" required>

        <label for="accountPassword">密码</label>
        <input id="accountPassword" name="password" type="password" autocomplete="current-password" required>

        <p class="account-feedback" id="accountFeedback" role="status" hidden></p>

        <div class="dialog-actions">
          <button class="dialog-cancel" id="closeAccountButton" type="button">暂时关闭</button>
          <button class="dialog-confirm account-submit" type="submit">登录</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module">
    const CONVERSATIONS_KEY = 'fairytale-ai-conversations';
    const ACTIVE_CONVERSATION_KEY = 'fairytale-ai-active-conversation';
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    const newConversationButton = document.getElementById('newConversationButton');
    const conversationList = document.getElementById('conversationList');
    const conversationCount = document.getElementById('conversationCount');
    const emptyConversations = document.getElementById('emptyConversations');
    const deleteDialog = document.getElementById('deleteDialog');
    const deleteConversationTitle = document.getElementById('deleteConversationTitle');
    const cancelDeleteButton = document.getElementById('cancelDeleteButton');
    const confirmDeleteButton = document.getElementById('confirmDeleteButton');
    const accountButton = document.getElementById('accountButton');
    const mobileAccountButton = document.getElementById('mobileAccountButton');
    const sidebar = document.getElementById('conversationSidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarScrim = document.getElementById('sidebarScrim');
    const accountDialog = document.getElementById('accountDialog');
    const closeAccountButton = document.getElementById('closeAccountButton');
    const accountForm = document.getElementById('accountForm');
    const accountFeedback = document.getElementById('accountFeedback');


    let conversations = await loadConversationsFromServer();
    let activeConversationId = localStorage.getItem(ACTIVE_CONVERSATION_KEY);
    let isSending = false;
    let pendingRefreshTimer = null;
    let thinkingTimer = null;
    let thinkingElement = null;
    let pendingDeleteConversationId = null;
    let deleteDialogReturnFocus = null;

    if (!activeConversationId || !conversations.some((item) => item.id === activeConversationId)) {
      const firstConversation = await createConversation();
      conversations.unshift(firstConversation);
      activeConversationId = firstConversation.id;
      saveState();
    }

    renderConversationList();
    renderActiveConversation();

    sendButton.addEventListener('click', sendMessage);
    newConversationButton.addEventListener('click', createNewConversation);
    sidebarToggle.addEventListener('click', toggleSidebar);
    sidebarScrim.addEventListener('click', closeSidebar);
    cancelDeleteButton.addEventListener('click', closeDeleteDialog);
    confirmDeleteButton.addEventListener('click', confirmDeleteConversation);
    accountButton.addEventListener('click', openAccountDialog);
    mobileAccountButton.addEventListener('click', openAccountDialog);
    closeAccountButton.addEventListener('click', closeAccountDialog);
    accountForm.addEventListener('submit', handleAccountSubmit);
    deleteDialog.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeDeleteDialog();
    });
    deleteDialog.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeDeleteDialog();
      }
    });
    deleteDialog.addEventListener('click', (event) => {
      if (event.target === deleteDialog) {
        closeDeleteDialog();
      }
    });
    accountDialog.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeAccountDialog();
    });
    accountDialog.addEventListener('click', (event) => {
      if (event.target === accountDialog) {
        closeAccountDialog();
      }
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeSidebar();
      }
    });

    function openSidebar() {
      sidebar.classList.add('is-open');
      sidebarScrim.classList.add('is-visible');
      document.body.classList.add('sidebar-open');
      sidebarToggle.setAttribute('aria-expanded', 'true');
      sidebarToggle.setAttribute('aria-label', '关闭会话书签');
      sidebarToggle.setAttribute('title', '关闭会话书签');
    }

    function closeSidebar() {
      sidebar.classList.remove('is-open');
      sidebarScrim.classList.remove('is-visible');
      document.body.classList.remove('sidebar-open');
      sidebarToggle.setAttribute('aria-expanded', 'false');
      sidebarToggle.setAttribute('aria-label', '打开会话书签');
      sidebarToggle.setAttribute('title', '打开会话书签');
    }

    function toggleSidebar() {
      if (sidebar.classList.contains('is-open')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    }

    function createId() {
      if (window.crypto && window.crypto.randomUUID) {
        return window.crypto.randomUUID();
      }

      return crypto.randomUUID();
    }

    function openAccountDialog() {
      accountFeedback.hidden = true;
      accountFeedback.textContent = '';
      accountDialog.showModal();
    }

    function closeAccountDialog() {
      if (accountDialog.open) {
        accountDialog.close();
      }
    }

    function handleAccountSubmit(event) {
      event.preventDefault();
      accountFeedback.textContent = '登录接口将在后端认证完成后接入。';
      accountFeedback.hidden = false;
    }

    async function createConversation() {
  const response = await fetch('/api/conversations', {
    method: 'POST',
  });

  if (!response.ok) {
    throw new Error('创建会话失败');
  }

  const data = await response.json();

  return {
    id: data.conversationId,
    title: '新会话',
    updatedAt: Date.now(),
    messages: [],
  };
}

async function loadConversationsFromServer() {
  try {
    const response = await fetch('/api/conversations');

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error('会话列表格式错误');
    }

    return data.map((item) => ({
      id: item.id,
      title: typeof item.title === 'string' ? item.title : '新会话',
      updatedAt: Date.parse(item.updatedAt) || Date.now(),
      messages: [],
    }));
  } catch (error) {
    console.error('读取数据库会话失败：', error);

    // 后端暂时不可用时，保留本地数据作为临时备用
    return loadConversations();
  }
}

async function loadConversationMessages(conversationId) {
  const response = await fetch(
    `/api/conversations/${encodeURIComponent(conversationId)}/messages`,
  );

  if (!response.ok) {
    throw new Error(`读取聊天记录失败：HTTP ${response.status}`);
  }

  const data = await response.json();

  if (!Array.isArray(data)) {
    throw new Error('聊天记录格式错误');
  }

    return data
      .filter(
        (message) =>
          message &&
        (message.role === 'user' ||
           message.role === 'assistant' ||
           message.role === 'system') &&
         typeof message.content === 'string' &&
         (message.status === 'PENDING' ||
           message.status === 'COMPLETED' ||
           message.status === 'FAILED'),
      )
      .map((message) => ({
        role: message.role,
        text: message.content,
        status: message.status,
      }));
  }

    function loadConversations() {
      try {
        const saved = localStorage.getItem(CONVERSATIONS_KEY);
        const parsed = saved ? JSON.parse(saved) : [];

        if (!Array.isArray(parsed)) return [];

        return parsed
          .filter((item) => item && typeof item.id === 'string')
          .map((item) => ({
            id: item.id,
            title: typeof item.title === 'string' ? item.title : '新会话',
            updatedAt: Number(item.updatedAt) || Date.now(),
            messages: Array.isArray(item.messages)
              ? item.messages.filter(
                  (message) =>
                    message &&
                    (message.role === 'user' ||
                      message.role === 'assistant' ||
                      message.role === 'system') &&
                    typeof message.text === 'string',
                )
              : [],
          }));
      } catch (error) {
        return [];
      }
    }

    function saveState() {
      try {
        localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(conversations));
        localStorage.setItem(ACTIVE_CONVERSATION_KEY, activeConversationId);
      } catch (error) {
        // 本地存储不可用时，当前页面仍可继续聊天
      }
    }

    function getConversation(conversationId = activeConversationId) {
      return conversations.find((conversation) => conversation.id === conversationId);
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();

      if (
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate()
      ) {
        return date.toLocaleTimeString('zh-CN', {
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      return `${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
    }

    function renderConversationList() {
      conversationList.replaceChildren();
      conversationCount.textContent = String(conversations.length);
      emptyConversations.hidden = conversations.length > 0;

      conversations
        .slice()
        .sort((a, b) => b.updatedAt - a.updatedAt)
        .forEach((conversation) => {
          const item = document.createElement('div');
          item.className = 'conversation-item';

          const selectButton = document.createElement('button');
          selectButton.type = 'button';
          selectButton.className = 'conversation-select';
          selectButton.classList.toggle('is-active', conversation.id === activeConversationId);
          selectButton.disabled = isSending;
          selectButton.setAttribute('aria-pressed', String(conversation.id === activeConversationId));
          selectButton.innerHTML = `
            <span class="conversation-copy">
              <span class="conversation-title"></span>
              <span class="conversation-meta"></span>
            </span>
          `;
          selectButton.querySelector('.conversation-title').textContent = conversation.title;
          selectButton.querySelector('.conversation-meta').textContent = formatTime(conversation.updatedAt);
          selectButton.addEventListener('click', () => selectConversation(conversation.id));

          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'conversation-delete';
          deleteButton.textContent = '删除';
          deleteButton.title = '删除会话';
          deleteButton.setAttribute('aria-label', `删除会话：${conversation.title}`);
          deleteButton.disabled = isSending;
          deleteButton.addEventListener('click', () => deleteConversation(conversation.id));

          item.append(selectButton, deleteButton);
          conversationList.appendChild(item);
        });
    }

function hasPendingMessage(conversation) {
  return conversation?.messages.some(
    (message) =>
      message.role === 'assistant' && message.status === 'PENDING',
  ) ?? false;
}

function renderMessages(conversation) {
  stopThinkingAnimation();
  messagesDiv.replaceChildren();

  conversation.messages.forEach((message) => {
    const messageClass =
      message.role === 'system' ? 'system-message' : message.role;

    if (message.status === 'PENDING') {
      const messageElement = addMessage(messageClass, '', false);
      startThinkingAnimation(messageElement);
      return;
    }

    const messageText =
      message.status === 'FAILED'
        ? 'AI 回复失败，请重新发送。'
        : message.text;

    addMessage(messageClass, messageText, false);
  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function stopThinkingAnimation() {
  if (thinkingTimer) {
    clearInterval(thinkingTimer);
    thinkingTimer = null;
  }

  if (thinkingElement) {
    thinkingElement.classList.remove('thinking');
    thinkingElement = null;
  }
}

function startThinkingAnimation(element) {
  stopThinkingAnimation();
  thinkingElement = element;
  thinkingElement.classList.add('thinking');

  let thinkingDots = 0;
  thinkingElement.textContent = 'AI 正在思考';
  thinkingTimer = setInterval(() => {
    thinkingDots = (thinkingDots + 1) % 4;
    thinkingElement.textContent =
      `AI 正在思考${'.'.repeat(thinkingDots)}`;
  }, 300);
}

function stopPendingRefresh() {
  if (pendingRefreshTimer) {
    clearInterval(pendingRefreshTimer);
    pendingRefreshTimer = null;
  }
}

function startPendingRefresh(conversationId) {
  stopPendingRefresh();

  pendingRefreshTimer = setInterval(async () => {
    if (conversationId !== activeConversationId) {
      stopPendingRefresh();
      return;
    }

    const conversation = getConversation(conversationId);
    if (!conversation) {
      stopPendingRefresh();
      return;
    }

    try {
      const previousMessages = conversation.messages;
      conversation.messages = await loadConversationMessages(
        conversationId,
      );
      const wasPending = hasPendingMessage({ messages: previousMessages });
      const isPending = hasPendingMessage(conversation);

      if (wasPending !== isPending || !wasPending) {
        renderMessages(conversation);
      }

      if (isPending) {
        setSendingState(true);
      } else {
        stopPendingRefresh();
        setSendingState(false);
      }
    } catch (error) {
      console.error('刷新聊天记录失败：', error);
    }
  }, 1000);
}

async function renderActiveConversation() {
  const conversation = getConversation();
  stopPendingRefresh();

  if (!conversation) {
    messagesDiv.replaceChildren();
    setSendingState(false);
    return;
  }

  try {
    conversation.messages = await loadConversationMessages(
      conversation.id,
    );
  } catch (error) {
    console.error('加载聊天记录失败：', error);
    return;
  }

  renderMessages(conversation);

  if (hasPendingMessage(conversation)) {
    setSendingState(true);
    startPendingRefresh(conversation.id);
  } else {
    setSendingState(false);
  }
}

    function selectConversation(conversationId) {
      if (isSending || conversationId === activeConversationId) return;

      activeConversationId = conversationId;
      closeSidebar();
      saveState();
      renderConversationList();
      renderActiveConversation();
      input.focus();
    }

    async function createNewConversation() {
      if (isSending) return;

      closeSidebar();
      const conversation = await createConversation();
      conversations.unshift(conversation);
      activeConversationId = conversation.id;
      saveState();
      renderConversationList();
      renderActiveConversation();
      input.focus();
    }

    function deleteConversation(conversationId) {
      if (isSending) return;

      const conversation = getConversation(conversationId);
      if (!conversation) return;

      pendingDeleteConversationId = conversationId;
      deleteDialogReturnFocus = document.activeElement;
      deleteConversationTitle.textContent = conversation.title;
      deleteDialog.showModal();
    }

    function closeDeleteDialog() {
      if (!deleteDialog.open || deleteDialog.classList.contains('is-closing')) return;

      deleteDialog.classList.add('is-closing');
      window.setTimeout(() => {
        deleteDialog.classList.remove('is-closing');
        deleteDialog.close();
        pendingDeleteConversationId = null;
        if (deleteDialogReturnFocus instanceof HTMLElement) {
          deleteDialogReturnFocus.focus();
        }
        deleteDialogReturnFocus = null;
      }, 160);
    }

    function confirmDeleteConversation() {
      const conversationId = pendingDeleteConversationId;
      if (!conversationId) return;

      closeDeleteDialog();
      window.setTimeout(() => performDeleteConversation(conversationId), 160);
    }

    async function performDeleteConversation(conversationId) {
      const conversation = getConversation(conversationId);
      if (!conversation) return;

      try {
        const response = await fetch(
          `/api/chat/${encodeURIComponent(conversationId)}`,
          {
            method: 'DELETE',
          },
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.deleted) {
          throw new Error('会话不存在或已经删除');
        }
      } catch (error) {
        console.error('删除会话失败：', error);
        return;
      }

      conversations = conversations.filter((item) => item.id !== conversationId);

      if (conversations.length === 0) {
        const replacement = await createConversation();
        conversations.push(replacement);
        activeConversationId = replacement.id;
      } else if (conversationId === activeConversationId) {
        activeConversationId = conversations[0].id;
      }

      saveState();
      renderConversationList();
      renderActiveConversation();
      input.focus();
    }

    function recordUserMessage(conversationId, text) {
      const conversation = getConversation(conversationId);
      if (!conversation) return;

      conversation.messages.push({ role: 'user', text });
      if (conversation.title === '新会话') {
        conversation.title = text.length > 28 ? `${text.slice(0, 28)}...` : text;
      }
      conversation.updatedAt = Date.now();
      saveState();
      renderConversationList();
    }

    function recordAssistantMessage(conversationId, text) {
      const conversation = getConversation(conversationId);
      if (!conversation || !text) return;

      conversation.messages.push({
        role: 'assistant',
        text,
        status: 'COMPLETED',
      });
      conversation.updatedAt = Date.now();
      saveState();
      renderConversationList();
    }

    function recordSystemMessage(conversationId, text) {
      const conversation = getConversation(conversationId);
      if (!conversation || !text) return;

      conversation.messages.push({ role: 'system', text });
      saveState();
    }

    function setSendingState(sending) {
      isSending = sending;
      input.disabled = sending;
      sendButton.disabled = sending;
      newConversationButton.disabled = sending;
      renderConversationList();
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message || isSending) return;

      const conversationId = activeConversationId;
      setSendingState(true);

      // 显示用户消息
      addMessage('user', message);
      recordUserMessage(conversationId, message);
      input.value = '';

      // 创建一个 AI 消息容器
      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'assistant';
      messagesDiv.appendChild(aiMsgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      startThinkingAnimation(aiMsgDiv);

      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversationId,
            message,
          }),
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let pendingText = '';
        let displayedText = '';
        let receivedText = '';
        const receivedSystemMessages = [];
        let typing = false;
        const stopThinking = () => {
          stopThinkingAnimation();
          aiMsgDiv.textContent = '';
        };

        const flushTyping = () => {
          if (!pendingText.length) {
            typing = false;
            return;
          }

          stopThinking();
          const nextChar = pendingText[0];
          pendingText = pendingText.slice(1);
          displayedText += nextChar;
          aiMsgDiv.textContent = displayedText;
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          typing = true;
          setTimeout(flushTyping, nextChar === '\n' ? 0 : 20);
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;

            const data = trimmed.slice(5).trim();
            if (data === '[DONE]') continue;

            try {
              const json = JSON.parse(data);
              if (json.type === 'system' && json.message) {
                addMessage('system-message', json.message);
                receivedSystemMessages.push(json.message);
                continue;
              }

              if (json.content) {
                pendingText += json.content;
                receivedText += json.content;
                if (!typing) {
                  flushTyping();
                }
              }
            } catch (e) {
              // 忽略解析错误
            }
          }
        }

        if (!typing && !displayedText.length && pendingText.length) {
          flushTyping();
        }
        if (displayedText.length > 0) {
          stopThinkingAnimation();
        }
        recordAssistantMessage(conversationId, receivedText);
        receivedSystemMessages.forEach((systemMessage) => {
          recordSystemMessage(conversationId, systemMessage);
        });
      } catch (error) {
        stopThinkingAnimation();
        aiMsgDiv.classList.remove('thinking');
        aiMsgDiv.textContent = '网络错误：' + error.message;
      } finally {
        setSendingState(false);
        input.focus();
      }
    }

    function addMessage(role, text, shouldScroll = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = role;
      msgDiv.textContent = text;
      messagesDiv.appendChild(msgDiv);
      if (shouldScroll) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
      return msgDiv;
    }
  </script>
</body>
</html>
